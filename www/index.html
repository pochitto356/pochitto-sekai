<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>せかいタッチ</title>
<style>
:root{
  --sea:#cfe6f3; --sea2:#b9dbee; --land:#f6f1e6; --edge:#a99f8c; --other:#e3ddd0;
  --l1:#ffe1a8; --l2:#ffbe6b; --l3:#52b788; --sel:#2d7ff9; --bad:#e5484d;
  --ink:#1d2733; --sub:#66717e; --card:#ffffff; --line:#e4e8ee; --accent:#2d7ff9; --accent-d:#1d5fc4;
  --font:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans CJK JP",system-ui,-apple-system,sans-serif;
  --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sea);color:var(--ink);font-family:var(--font);overscroll-behavior:none}
button{font-family:inherit}

/* 地図 */
#map{position:fixed;inset:0;touch-action:none;background:linear-gradient(180deg,var(--sea),var(--sea2))}
#map svg{width:100%;height:100%;display:block}
.c{fill:var(--land);stroke:var(--edge);stroke-width:.6;vector-effect:non-scaling-stroke;stroke-linejoin:round;transition:fill .25s}
.c.l1{fill:var(--l1)}.c.l2{fill:var(--l2)}.c.l3{fill:var(--l3)}
.c.dim{opacity:.35}
.c.sel{fill:var(--sel)!important;opacity:1}
.c.ok{fill:var(--l3)!important;opacity:1}
.c.ng{fill:var(--bad)!important;opacity:1}
.c.goal{animation:goal 1s ease-in-out infinite;opacity:1}
@keyframes goal{50%{fill:#ffd23f}}
.o{fill:var(--other);stroke:var(--edge);stroke-width:.4;vector-effect:non-scaling-stroke;pointer-events:none}
.dot{fill:var(--land);stroke:var(--edge);stroke-width:1;vector-effect:non-scaling-stroke}
.dot.l1{fill:var(--l1)}.dot.l2{fill:var(--l2)}.dot.l3{fill:var(--l3)}
.dot.sel{fill:var(--sel)}.dot.ok{fill:var(--l3)}.dot.ng{fill:var(--bad)}.dot.goal{animation:goal 1s infinite}
.lbl{font-size:12px;font-weight:800;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;pointer-events:none;text-anchor:middle}

/* 上と下 */
.top{position:fixed;left:0;right:0;top:0;padding:calc(var(--safe-t) + 8px) 12px 0;display:flex;gap:8px;align-items:flex-start;pointer-events:none;z-index:10}
.top>*{pointer-events:auto}
.brand{background:rgba(255,255,255,.92);border-radius:14px;padding:7px 12px;box-shadow:0 2px 10px rgba(20,40,70,.12);font-weight:900;font-size:15px;display:flex;align-items:center;gap:6px}
.brand i{font-style:normal;font-size:18px}
@media (max-width:430px){.brand span{display:none}.brand{padding:7px 9px}}
.chip{background:rgba(255,255,255,.92);border-radius:14px;padding:7px 11px;box-shadow:0 2px 10px rgba(20,40,70,.12);font-size:12px;color:var(--sub);font-weight:700}
.chip b{color:var(--ink);font-size:14px}
.search{flex:1;min-width:0;position:relative}
.search input{width:100%;border:0;border-radius:14px;padding:9px 12px;font-size:15px;font-family:inherit;box-shadow:0 2px 10px rgba(20,40,70,.12);background:rgba(255,255,255,.95);outline:none;-webkit-user-select:text;user-select:text}
.sugg{position:absolute;left:0;right:0;top:44px;background:#fff;border-radius:12px;box-shadow:0 6px 20px rgba(20,40,70,.18);overflow:hidden;display:none}
.sugg.on{display:block}
.sugg div{padding:10px 12px;border-bottom:1px solid var(--line);font-size:15px}
.zoom{position:fixed;right:12px;bottom:calc(var(--safe-b) + 150px);display:flex;flex-direction:column;gap:8px;z-index:9}
.zoom button{width:42px;height:42px;border-radius:12px;border:0;background:rgba(255,255,255,.95);box-shadow:0 2px 10px rgba(20,40,70,.15);font-size:20px;font-weight:800;color:var(--ink)}
body.has-ad .zoom{bottom:calc(var(--safe-b) + 210px)}

.tabs{position:fixed;left:12px;right:12px;bottom:calc(var(--safe-b) + 10px);display:flex;background:rgba(255,255,255,.96);border-radius:20px;box-shadow:0 4px 18px rgba(20,40,70,.18);padding:6px;z-index:20}
body.has-ad .tabs{bottom:calc(var(--safe-b) + 66px)}
.tabs button{flex:1;border:0;background:none;border-radius:14px;padding:8px 0 6px;font-size:11px;font-weight:800;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button span{font-size:20px;line-height:1}
.tabs button.on{background:#eaf2ff;color:var(--accent)}
body.playing .tabs{display:none}
body.playing .zoom{bottom:calc(var(--safe-b) + 76px)}
body.playing.has-ad .zoom{bottom:calc(var(--safe-b) + 132px)}

/* 国カード */
.sheet{position:fixed;left:12px;right:12px;bottom:calc(var(--safe-b) + 84px);background:var(--card);border-radius:20px;box-shadow:0 8px 28px rgba(20,40,70,.22);padding:14px 16px;z-index:15;transform:translateY(140%);transition:transform .25s;max-height:46vh;overflow-y:auto}
body.has-ad .sheet{bottom:calc(var(--safe-b) + 140px)}
.sheet.on{transform:none}
.sheet .x{position:absolute;right:10px;top:10px;width:30px;height:30px;border-radius:50%;border:0;background:#f0f3f7;font-size:15px;color:var(--sub)}
.kh{display:flex;align-items:center;gap:12px}
.flag{font-size:44px;line-height:1}
.kn{font-size:22px;font-weight:900}
.ks{font-size:12px;color:var(--sub);margin-top:2px}
.kg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.kg div{background:#f5f7fa;border-radius:12px;padding:8px 10px}
.kg span{display:block;font-size:11px;color:var(--sub)}
.kg b{font-size:15px}
.knote{font-size:11px;color:var(--sub);margin-top:6px;line-height:1.5}
.kadj{margin-top:10px;font-size:11px;color:var(--sub)}
.kadj button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;margin:4px 4px 0 0;font-size:13px;font-weight:700;color:var(--ink)}
.stars{color:#f5a524;font-size:13px;letter-spacing:1px}
.stars i{font-style:normal;color:#d6dbe2}

/* 当てるモード */
.ask{position:fixed;left:12px;right:12px;top:calc(var(--safe-t) + 8px);background:var(--card);border-radius:18px;box-shadow:0 6px 22px rgba(20,40,70,.2);padding:10px 12px;z-index:25;display:none;align-items:center;gap:10px}
body.playing .ask{display:flex}
body.playing .top{display:none}
.ask .flag{font-size:38px}
.ask .q{flex:1;min-width:0}
.ask .q b{display:block;font-size:20px;font-weight:900;line-height:1.25}
.ask .q span{font-size:12px;color:var(--sub)}
.ask .n{font-size:12px;color:var(--sub);font-weight:800;text-align:right;white-space:nowrap}
.ask .quit{width:32px;height:32px;border-radius:50%;border:0;background:#f0f3f7;color:var(--sub);font-size:15px;flex:none}
.hintbar{position:fixed;left:12px;right:12px;bottom:calc(var(--safe-b) + 14px);display:none;gap:8px;z-index:25}
body.playing .hintbar{display:flex}
body.playing.has-ad .hintbar{bottom:calc(var(--safe-b) + 70px)}
.hintbar button{flex:1;border:0;border-radius:14px;padding:13px;font-size:14px;font-weight:800;background:rgba(255,255,255,.96);box-shadow:0 3px 12px rgba(20,40,70,.18);color:var(--ink)}
.fb{position:fixed;left:50%;top:calc(var(--safe-t) + 92px);transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:8px 16px;font-size:14px;font-weight:800;z-index:26;opacity:0;transition:opacity .2s;white-space:nowrap;pointer-events:none}
.fb.on{opacity:1}.fb.ok{background:#2f9e6b}.fb.ng{background:var(--bad)}

/* パネル（選ぶ・結果・きろく・設定） */
.panel{position:fixed;inset:0;background:rgba(18,30,45,.35);z-index:40;display:none;align-items:flex-end;justify-content:center}
.panel.on{display:flex}
.pbox{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px 18px calc(var(--safe-b) + 18px);max-height:88vh;overflow-y:auto;animation:up .22s}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ph h2{margin:0;font-size:20px}
.ph button{width:34px;height:34px;border-radius:50%;border:0;background:#f0f3f7;font-size:16px;color:var(--sub)}
.lead{font-size:13px;color:var(--sub);line-height:1.6;margin:0 0 12px}
.areas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.area{border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px;text-align:left}
.area.on{border-color:var(--accent);background:#f2f7ff}
.area b{display:block;font-size:16px}
.area span{font-size:12px;color:var(--sub)}
.bar{height:6px;border-radius:3px;background:#edf0f4;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--l3)}
.seg{display:flex;background:#f0f3f7;border-radius:12px;padding:4px;margin:14px 0 4px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px;font-size:14px;font-weight:800;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px;font-size:16px;font-weight:900;color:#fff;background:var(--accent);box-shadow:0 4px 0 var(--accent-d);margin-top:14px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-d)}
.btn.sub{background:#f0f3f7;color:var(--ink);box-shadow:none}
.big{font-size:52px;font-weight:900;text-align:center;line-height:1;margin:8px 0 2px}
.big small{font-size:18px;color:var(--sub);margin-left:4px}
.cap{text-align:center;color:var(--sub);font-size:13px}
.rlist{margin-top:12px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.rlist div{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px}
.rlist div:last-child{border-bottom:0}
.rlist .m{margin-left:auto;font-weight:900}
.rlist .m.a{color:#2f9e6b}.rlist .m.b{color:#d98a1c}.rlist .m.c{color:var(--bad)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin:4px 0 12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid rgba(0,0,0,.12)}
.reg{display:flex;align-items:center;gap:10px;margin:8px 0}
.reg b{width:108px;font-size:14px;white-space:nowrap}
.reg .bar{flex:1;margin:0;height:10px;border-radius:5px}
.reg span{width:64px;text-align:right;font-size:12px;color:var(--sub)}
.sec{font-size:12px;font-weight:800;color:var(--sub);margin:18px 0 8px;letter-spacing:.05em}
.list{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border-bottom:1px solid var(--line);font-size:15px;color:var(--ink);text-decoration:none}
.item:last-child{border-bottom:0}
.item span{font-size:12px;color:var(--sub)}
.sw{width:48px;height:28px;border-radius:14px;background:#d6dbe2;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--l3)}.sw.on::after{left:23px}
.foot{font-size:11px;color:var(--sub);text-align:center;line-height:1.7;margin-top:14px}

#dlg{position:fixed;inset:0;background:rgba(18,30,45,.45);z-index:60;display:none;align-items:center;justify-content:center;padding:24px}
#dlg.on{display:flex}
#dlg .box{background:#fff;border-radius:18px;padding:18px;max-width:340px;width:100%}
#dlg h3{margin:0 0 8px;font-size:17px}
#dlg p{margin:0 0 6px;font-size:14px;color:var(--sub);line-height:1.6;white-space:pre-line;-webkit-user-select:text;user-select:text}
#dlg .row{display:flex;gap:8px}#dlg .row .btn{margin-top:10px;padding:12px;font-size:15px}
#toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 110px);transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:9px 16px;font-size:14px;font-weight:700;opacity:0;transition:opacity .2s;z-index:70;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="map"></div>

<div class="top">
  <div class="brand"><i>🌏</i><span>せかいタッチ</span></div>
  <div class="search"><input id="q" type="search" placeholder="🔍 国名・首都でさがす" autocomplete="off"><div class="sugg" id="sugg"></div></div>
  <div class="chip" id="prog"></div>
</div>

<div class="zoom zoom-hide"><button id="zin">＋</button><button id="zout">－</button><button id="zall" style="font-size:16px">🌐</button></div>

<div class="sheet" id="sheet"></div>

<div class="ask" id="ask"></div>
<div class="hintbar"><button id="hintBtn">💡 ヒント</button><button id="skipBtn">わからない</button></div>
<div class="fb" id="fb"></div>

<nav class="tabs" id="tabs">
  <button data-tab="explore" class="on"><span>🗺️</span>さがす</button>
  <button data-tab="play"><span>📍</span>場所あて</button>
  <button data-tab="stats"><span>📊</span>きろく</button>
  <button data-tab="settings"><span>⚙️</span>設定</button>
</nav>

<div class="panel" id="panel"><div class="pbox" id="pbox"></div></div>
<div id="dlg"><div class="box"><h3 id="dT"></h3><p id="dB"></p><div class="row" id="dR"></div></div></div>
<div id="toast"></div>

<script src="geo.js"></script>
<script src="native.js"></script>
<script src="app.js"></script>
</body>
</html>
